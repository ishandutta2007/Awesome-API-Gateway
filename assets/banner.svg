<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#090d16"/><stop offset="50%" stop-color="#0f172a"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#06b6d4"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/><stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/></linearGradient><radialGradient id="portalGlow" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".8"/><stop offset="40%" stop-color="#818cf8" stop-opacity=".4"/><stop offset="100%" stop-color="#0f172a" stop-opacity="0"/></radialGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="subtleGlow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><style>@keyframes pulse{0%{transform:scale(1);opacity:.85}50%{transform:scale(1.05);opacity:1;filter:drop-shadow(0 0 16px rgba(139,92,246,.9))}}@keyframes floatSlow{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes floatFast{0%{transform:translateY(0)}50%{transform:translateY(6px)}}.circuit-line{stroke:#334155;stroke-width:1.5;fill:none}.traffic-pulse{stroke-dasharray:20,80;stroke-linecap:round;animation:dash 4s linear infinite}.traffic-cyan{stroke:#38bdf8;filter:drop-shadow(0 0 6px #38bdf8)}.traffic-cyan,.traffic-pink,.traffic-purple{stroke-width:2.5}.traffic-purple{stroke:#a855f7;filter:drop-shadow