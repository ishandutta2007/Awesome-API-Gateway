<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(30, 41, 59, 0.8)"/>
      <stop offset="100%" stop-color="rgba(15, 23, 42, 0.9)"/>
    </linearGradient>

    <radialGradient id="portalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="40%" stop-color="#818cf8" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Filters for Bloom/Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Dynamic Styles & Animations -->
    <style>
      @keyframes dash {
        to {
          stroke-dashoffset: -400;
        }
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.05);
          opacity: 1;
          filter: drop-shadow(0 0 16px rgba(139, 92, 246, 0.9));
        }
      }
      @keyframes floatSlow {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-8px);
        }
      }
      @keyframes floatFast {
        0%, 100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(6px);
        }
      }
      .circuit-line {
        stroke: #334155;
        stroke-width: 1.5;
        fill: none;
      }
      .traffic-pulse {
        stroke-dasharray: 20, 80;
        stroke-linecap: round;
        animation: dash 4s linear infinite;
      }
      .traffic-cyan {
        stroke: #38bdf8;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 6px #38bdf8);
      }
      .traffic-purple {
        stroke: #a855f7;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 6px #a855f7);
      }
      .traffic-pink {
        stroke: #f43f5e;
        stroke-width: 2.5;
        filter: drop-shadow(0 0 6px #f43f5e);
      }
      .gateway-core {
        transform-origin: 980px 180px;
        animation: pulse 3s ease-in-out infinite;
      }
      .floating-node-1 {
        animation: floatSlow 5s ease-in-out infinite;
      }
      .floating-node-2 {
        animation: floatFast 4s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.12">
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200 M0,300 H1200" stroke="#94a3b8" stroke-width="1" />
    <path d="M120,0 V360 M240,0 V360 M360,0 V360 M480,0 V360 M600,0 V360 M720,0 V360 M840,0 V360 M960,0 V360 M1080,0 V360" stroke="#94a3b8" stroke-width="1" />
  </g>

  <!-- Ambient Glow Behind Gateway -->
  <circle cx="980" cy="180" r="160" fill="url(#portalGlow)" opacity="0.5" />

  <!-- Network Circuit Lines (North-South & East-West Gateway Routes) -->
  <g class="circuit-line">
    <path d="M 680,180 L 800,180 L 850,130 L 980,130" />
    <path d="M 680,180 L 800,180 L 850,230 L 980,230" />
    <path d="M 980,130 L 1050,130 L 1110,80 L 1180,80" />
    <path d="M 980,180 L 1180,180" />
    <path d="M 980,230 L 1050,230 L 1110,280 L 1180,280" />
    <path d="M 850,70 L 930,70 L 980,130" />
    <path d="M 850,290 L 930,290 L 980,230" />
  </g>

  <!-- Dynamic Moving Data Packets (Traffic Simulation) -->
  <path d="M 680,180 L 800,180 L 850,130 L 980,130 L 1050,130 L 1110,80 L 1180,80" class="circuit-line traffic-pulse traffic-cyan" />
  <path d="M 680,180 L 980,180 L 1180,180" class="circuit-line traffic-pulse traffic-purple" style="animation-delay: -1.5s;" />
  <path d="M 680,180 L 800,180 L 850,230 L 980,230 L 1050,230 L 1110,280 L 1180,280" class="circuit-line traffic-pulse traffic-pink" style="animation-delay: -3s;" />

  <!-- Gateway Portal Visualization (Right Side) -->
  <g class="gateway-core">
    <!-- Outer Hex Ring -->
    <polygon points="980,105 1045,142 1045,218 980,255 915,218 915,142" fill="none" stroke="#6366f1" stroke-width="2.5" opacity="0.7" />
    <!-- Inner Hex Ring -->
    <polygon points="980,120 1032,150 1032,210 980,240 928,210 928,150" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.9" />
    
    <!-- Central Shield / Gateway Symbol -->
    <circle cx="980" cy="180" r="38" fill="#1e1b4b" stroke="#a855f7" stroke-width="2.5" filter="url(#glow)"/>
    <path d="M 970,165 L 990,165 C 998,165 1000,172 1000,180 C 1000,192 985,198 980,201 C 975,198 960,192 960,180 C 960,172 962,165 970,165 Z" fill="#38bdf8" opacity="0.9" />
    <path d="M 975,180 L 985,180 M 980,175 L 980,185" stroke="#090d16" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Microservice Endpoints (Hex / Circle Nodes) -->
  <g class="floating-node-1">
    <circle cx="1110" cy="80" r="8" fill="#090d16" stroke="#38bdf8" stroke-width="2.5" />
    <text x="1125" y="84" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Auth</text>
  </g>
  <g class="floating-node-2">
    <circle cx="1140" cy="180" r="8" fill="#090d16" stroke="#a855f7" stroke-width="2.5" />
    <text x="1155" y="184" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Proxy</text>
  </g>
  <g class="floating-node-1">
    <circle cx="1110" cy="280" r="8" fill="#090d16" stroke="#f43f5e" stroke-width="2.5" />
    <text x="1125" y="284" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">Mesh</text>
  </g>

  <!-- Left Content: Titles, Subtitle & Badges -->
  <g transform="translate(60, 0)">
    <!-- Category Tag -->
    <g transform="translate(0, 52)">
      <rect width="180" height="26" rx="13" fill="rgba(99, 102, 241, 0.18)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <circle cx="14" cy="13" r="4" fill="#38bdf8" />
      <text x="26" y="17" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CURATED PLATFORMS</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 118)">
      <text fill="url(#cyanPurple)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5" filter="url(#subtleGlow)">
        🚪 Awesome API Gateway
      </text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 158)">
      <text fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
        Top API Gateways, Ingress Controllers, Service Meshes &amp; Edge Proxies
      </text>
      <text y="24" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
        Architectures, comparisons, feature matrix &amp; transparent pricing for modern APIs
      </text>
    </g>

    <!-- Interactive / Feature Highlights Badges -->
    <g transform="translate(0, 230)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="112" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⚡ Routing &amp; LB</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(122, 0)">
        <rect width="128" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🔐 Auth &amp; Policies</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(260, 0)">
        <rect width="138" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">☸️ Cloud &amp; K8s Ingress</text>
      </g>
      <!-- Badge 4 -->
      <g transform="translate(408, 0)">
        <rect width="118" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🤖 AI / LLM Gate</text>
      </g>
      <!-- Badge 5 -->
      <g transform="translate(536, 0)">
        <rect width="128" height="34" rx="8" fill="url(#badgeGrad)" stroke="#334155" stroke-width="1"/>
        <text x="12" y="21" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">💰 SaaS &amp; Pricing</text>
      </g>
    </g>

    <!-- Footer Stats / Meta Line -->
    <g transform="translate(0, 305)">
      <text fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        🚀 High Performance • 🛡️ Zero Trust • 🌐 Open-Source First • 📊 Production Ready
      </text>
    </g>
  </g>
</svg>
